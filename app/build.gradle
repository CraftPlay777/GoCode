plugins {
    id 'com.android.application'
}

android {
    namespace 'com.craftplay777.gocode'
    compileSdk 34

    defaultConfig {
        applicationId "com.craftplay777.gocode"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
